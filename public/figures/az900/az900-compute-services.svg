<text x="480" y="34" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Choosing Azure compute</text>
<rect x="55" y="100" width="200" height="170" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="155" y="166.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1b2733" text-anchor="middle">Virtual machines</text><text x="155" y="185" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">full OS control</text><text x="155" y="201.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="155" y="217.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">lift-and-shift · custom stacks</text><rect x="275" y="100" width="200" height="170" rx="10" fill="#e6f2e6" stroke="#107c10" stroke-width="1.4"/><text x="375" y="166.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1b2733" text-anchor="middle">Containers ACI / AKS</text><text x="375" y="185" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">no OS inside — fast, dense</text><text x="375" y="201.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="375" y="217.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">microservices · portability</text><rect x="495" y="100" width="200" height="170" rx="10" fill="#efe9f7" stroke="#5c2d91" stroke-width="1.4"/><text x="595" y="166.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1b2733" text-anchor="middle">App Service</text><text x="595" y="185" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">managed web platform</text><text x="595" y="201.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="595" y="217.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">web apps &amp; APIs, no servers</text><rect x="715" y="100" width="200" height="170" rx="10" fill="#fdeee8" stroke="#d83b01" stroke-width="1.4"/><text x="815" y="166.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1b2733" text-anchor="middle">Functions</text><text x="815" y="185" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">serverless, event-driven</text><text x="815" y="201.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="815" y="217.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">pay per execution</text><text x="480" y="320" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" fill="#1b2733" text-anchor="middle">More management ⟵ VMs · containers · App Service · Functions ⟶ less management</text><text x="480" y="352" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5b6770" text-anchor="middle">Also: VM scale sets (auto-scaling identical VMs) · availability sets (update + fault domains) · Azure Virtual Desktop</text>
</svg>