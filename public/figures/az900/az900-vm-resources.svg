<text x="480" y="34" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">What a virtual machine needs</text>
<rect x="380" y="155" width="200" height="120" rx="10" fill="#0078d4" stroke="#005a9e" stroke-width="1.4"/><text x="480" y="221.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Azure VM</text><rect x="70" y="95" width="195" height="88" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="167.5" y="136.3125" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" fill="#1b2733" text-anchor="middle">Size</text><text x="167.5" y="154.4375" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">vCPUs &amp; RAM</text><path d="M267 139L378 215" stroke="#005a9e" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="70" y="265" width="195" height="88" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="167.5" y="306.3125" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" fill="#1b2733" text-anchor="middle">Managed disks</text><text x="167.5" y="324.4375" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">OS + data disks</text><path d="M267 309L378 215" stroke="#005a9e" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="700" y="95" width="195" height="88" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="797.5" y="136.3125" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" fill="#1b2733" text-anchor="middle">Network interface</text><text x="797.5" y="154.4375" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">in a VNet subnet</text><path d="M698 139L582 215" stroke="#005a9e" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="700" y="265" width="195" height="88" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="797.5" y="306.3125" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" fill="#1b2733" text-anchor="middle">IP address &amp; NSG</text><text x="797.5" y="324.4375" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">public/private + firewall rules</text><path d="M698 309L582 215" stroke="#005a9e" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="480" y="340" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1b2733" text-anchor="middle">Creating a VM creates these supporting resources with it — they live in the same resource group</text>
</svg>