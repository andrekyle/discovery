apple-system, sans-serif" font-size="13" font-weight="600" fill="#1b2733" text-anchor="middle">internet-reachable IP</text><rect x="640" y="85" width="260" height="130" rx="12" fill="#e6f2e6" stroke="#107c10" stroke-width="1.5"/><text x="770" y="112" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#107c10" text-anchor="middle">Peered VNet</text><text x="770" y="138" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5b6770" text-anchor="middle">private backbone traffic,</text><text x="770" y="158" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5b6770" text-anchor="middle">same or different region</text><path d="M577 160 h60" stroke="#107c10" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="640" y="245" width="260" height="140" rx="12" fill="#efe9f7" stroke="#5c2d91" stroke-width="1.5"/><text x="770" y="272" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#5c2d91" text-anchor="middle">On-premises office</text><text x="770" y="300" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5b6770" text-anchor="middle">VPN Gateway — encrypted</text><text x="770" y="318" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5b6770" text-anchor="middle">tunnel over the internet</text><text x="770" y="344" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5b6770" text-anchor="middle">ExpressRoute — private</text><text x="770" y="362" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5b6770" text-anchor="middle">dedicated circuit</text><path d="M577 315 h60" stroke="#5c2d91" stroke-width="2.6" marker-end="url(#arr)"/><text x="480" y="430" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1b2733" text-anchor="middle">Subnets segment the address space · peering joins VNets · endpoints control exposure</text><text x="480" y="460" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5b6770" text-anchor="middle">Azure DNS answers name lookups on Azure's global anycast network</text>
