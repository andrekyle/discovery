<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="Blob storage access tiers">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#005a9e"/>
  </marker>
</defs>
<rect x="0" y="0" width="960" height="430" rx="14" fill="#ffffff" stroke="#c7d5e0"/>
<rect x="0" y="0" width="960" height="52" rx="14" fill="#0078d4"/>
<rect x="0" y="30" width="960" height="22" fill="#0078d4"/>
<text x="480" y="34" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Blob storage access tiers</text>
<rect x="55" y="100" width="200" height="165" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="155" y="164.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1b2733" text-anchor="middle">Hot</text><text x="155" y="185.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">frequent access</text><text x="155" y="202" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="155" y="218.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">highest storage · lowest access</text><rect x="275" y="100" width="200" height="165" rx="10" fill="#e6f2e6" stroke="#107c10" stroke-width="1.4"/><text x="375" y="164.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1b2733" text-anchor="middle">Cool</text><text x="375" y="185.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">infrequent · ≥30 days</text><text x="375" y="202" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="375" y="218.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">lower storage · higher access</text><rect x="495" y="100" width="200" height="165" rx="10" fill="#efe9f7" stroke="#5c2d91" stroke-width="1.4"/><text x="595" y="164.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1b2733" text-anchor="middle">Cold</text><text x="595" y="185.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">rare · ≥90 days</text><text x="595" y="202" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="595" y="218.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">lower still · higher access</text><rect x="715" y="100" width="200" height="165" rx="10" fill="#fdeee8" stroke="#d83b01" stroke-width="1.4"/><text x="815" y="164.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1b2733" text-anchor="middle">Archive</text><text x="815" y="185.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">offline · ≥180 days</text><text x="815" y="202" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="815" y="218.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">cheapest · hours to rehydrate</text><path d="M80 300L880 300" stroke="#005a9e" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="480" y="330" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400" fill="#1b2733" text-anchor="middle">cheaper to store, more expensive (and slower) to access ⟶</text><text x="480" y="370" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1b2733" text-anchor="middle">Match the tier to how often the data is touched</text>
</svg>