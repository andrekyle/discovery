<rect x="355" y="80" width="250" height="84" rx="10" fill="#0078d4" stroke="#005a9e" stroke-width="1.4"/><text x="480" y="128.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">The internet</text><rect x="60" y="240" width="190" height="96" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="155" y="285.875" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1b2733" text-anchor="middle">Compute</text><text x="155" y="305.875" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">VMs · containers · serverless</text><path d="M155 238L155 172" stroke="#005a9e" stroke-width="2.4" fill="none" marker-start="url(#arr)"/><rect x="290" y="240" width="190" height="96" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="385" y="285.875" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1b2733" text-anchor="middle">Storage</text><text x="385" y="305.875" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">blobs · files · disks</text><path d="M385 238L385 172" stroke="#005a9e" stroke-width="2.4" fill="none" marker-start="url(#arr)"/><rect x="520" y="240" width="190" height="96" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="615" y="285.875" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1b2733" text-anchor="middle">Networking</text><text x="615" y="305.875" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">VNets · VPN · DNS</text><path d="M615 238L615 172" stroke="#005a9e" stroke-width="2.4" fill="none" marker-start="url(#arr)"/><rect x="750" y="240" width="190" height="96" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="845" y="285.875" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1b2733" text-anchor="middle">Higher services</text><text x="845" y="305.875" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">databases · AI · IoT</text><path d="M845 238L845 172" stroke="#005a9e" stroke-width="2.4" fill="none" marker-start="url(#arr)"/><text x="480" y="390" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" fill="#1b2733" text-anchor="middle">Rent what you need, pay for what you use — no datacenter of your own required</text>
