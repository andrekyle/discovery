<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="Comparing cloud pricing models">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#005a9e"/>
  </marker>
</defs>
<rect x="0" y="0" width="960" height="430" rx="14" fill="#ffffff" stroke="#c7d5e0"/>
<rect x="0" y="0" width="960" height="52" rx="14" fill="#0078d4"/>
<rect x="0" y="30" width="960" height="22" fill="#0078d4"/>
<text x="480" y="34" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Comparing cloud pricing models</text>
<rect x="55" y="100" width="200" height="170" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="155" y="166.4375" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="600" fill="#1b2733" text-anchor="middle">Pay-as-you-go</text><text x="155" y="185.8125" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">No commitment</text><text x="155" y="202.0625" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="155" y="218.3125" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">Variable workloads</text><rect x="275" y="100" width="200" height="170" rx="10" fill="#e6f2e6" stroke="#107c10" stroke-width="1.4"/><text x="375" y="166.4375" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="600" fill="#1b2733" text-anchor="middle">Reserved instances</text><text x="375" y="185.8125" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">1 or 3 years · up to ~72% off</text><text x="375" y="202.0625" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="375" y="218.3125" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">Steady production</text><rect x="495" y="100" width="200" height="170" rx="10" fill="#efe9f7" stroke="#5c2d91" stroke-width="1.4"/><text x="595" y="166.4375" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="600" fill="#1b2733" text-anchor="middle">Savings plan</text><text x="595" y="185.8125" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">Fixed hourly spend, 1/3 yrs</text><text x="595" y="202.0625" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="595" y="218.3125" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">Predictable spend, flexible services</text><rect x="715" y="100" width="200" height="170" rx="10" fill="#fdeee8" stroke="#d83b01" stroke-width="1.4"/><text x="815" y="166.4375" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="600" fill="#1b2733" text-anchor="middle">Spot</text><text x="815" y="185.8125" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">Deepest discount · can be evicted</text><text x="815" y="202.0625" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="815" y="218.3125" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">Interruptible batch jobs</text><text x="480" y="320" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1b2733" text-anchor="middle">Commitment buys discount — flexibility costs more per hour</text><text x="480" y="350" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400" fill="#5b6770" text-anchor="middle">Serverless goes further: billed per execution, scales to zero between events</text>
</svg>