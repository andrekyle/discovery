<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Cloud models — public, private, hybrid">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#005a9e"/>
  </marker>
</defs>
<rect x="0" y="0" width="960" height="470" rx="14" fill="#ffffff" stroke="#c7d5e0"/>
<rect x="0" y="0" width="960" height="52" rx="14" fill="#0078d4"/>
<rect x="0" y="30" width="960" height="22" fill="#0078d4"/>
<text x="480" y="34" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Cloud models — public, private, hybrid</text>
<rect x="60" y="90" width="260" height="200" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="190" y="172" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1b2733" text-anchor="middle">Public cloud</text><text x="190" y="193.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">Shared provider infrastructure</text><text x="190" y="209.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">No CapEx · scale instantly</text><text x="190" y="225.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">Anyone can purchase</text><rect x="640" y="90" width="260" height="200" rx="10" fill="#efe9f7" stroke="#5c2d91" stroke-width="1.4"/><text x="770" y="172" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1b2733" text-anchor="middle">Private cloud</text><text x="770" y="193.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">Single organisation</text><text x="770" y="209.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">Maximum control</text><text x="770" y="225.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">You own the hardware cost</text><rect x="350" y="140" width="260" height="200" rx="10" fill="#e6f2e6" stroke="#107c10" stroke-width="1.4"/><text x="480" y="222" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1b2733" text-anchor="middle">Hybrid cloud</text><text x="480" y="243.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">Best of both worlds</text><text x="480" y="259.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">Sensitive workloads private,</text><text x="480" y="275.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">burst to public for scale</text><path d="M322 190L348 210" stroke="#005a9e" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><path d="M638 190L612 210" stroke="#005a9e" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><text x="480" y="388" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1b2733" text-anchor="middle">Multi-cloud: services from more than one public provider — managed consistently with Azure Arc</text><text x="480" y="418" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#5b6770" text-anchor="middle">Choose per workload: control vs cost vs speed of scaling</text>
</svg>