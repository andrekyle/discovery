<rect x="55" y="85" width="440" height="290" rx="12" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.5"/><text x="275" y="112" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#005a9e" text-anchor="middle">Region — South Africa North (Johannesburg)</text><rect x="80" y="135" width="120" height="130" rx="10" fill="#ffffff" stroke="#0078d4" stroke-width="1.4"/><text x="140" y="189" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1b2733" text-anchor="middle">Zone 1</text><text x="140" y="206.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">own power,</text><text x="140" y="222.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">cooling, network</text><rect x="215" y="135" width="120" height="130" rx="10" fill="#ffffff" stroke="#0078d4" stroke-width="1.4"/><text x="275" y="189" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1b2733" text-anchor="middle">Zone 2</text><text x="275" y="206.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">own power,</text><text x="275" y="222.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">cooling, network</text><rect x="350" y="135" width="120" height="130" rx="10" fill="#ffffff" stroke="#0078d4" stroke-width="1.4"/><text x="410" y="189" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1b2733" text-anchor="middle">Zone 3</text><text x="410" y="206.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">own power,</text><text x="410" y="222.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">cooling, network</text><text x="275" y="300" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1b2733" text-anchor="middle">Zones = physically separate datacenters,</text><text x="275" y="318" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#1b2733" text-anchor="middle">linked by private fibre — survive a datacenter failure</text><rect x="620" y="130" width="280" height="180" rx="12" fill="#e6f2e6" stroke="#107c10" stroke-width="1.5"/><text x="760" y="160" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#107c10" text-anchor="middle">Paired region</text><text x="760" y="185" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#1b2733" text-anchor="middle">South Africa West (Cape Town)</text><text x="760" y="215" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5b6770" text-anchor="middle">≥ 300 miles away</text><text x="760" y="237" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5b6770" text-anchor="middle">disaster failover target</text><text x="760" y="259" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5b6770" text-anchor="middle">staged platform updates</text><path d="M497 230 C560 230 560 220 618 220" stroke="#107c10" stroke-width="2.6" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="480" y="420" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1b2733" text-anchor="middle">Sovereign regions (e.g. US Government) are isolated instances for compliance-critical customers</text>
