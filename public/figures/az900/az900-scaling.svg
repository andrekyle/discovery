<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Vertical vs horizontal scaling">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#005a9e"/>
  </marker>
</defs>
<rect x="0" y="0" width="960" height="470" rx="14" fill="#ffffff" stroke="#c7d5e0"/>
<rect x="0" y="0" width="960" height="52" rx="14" fill="#0078d4"/>
<rect x="0" y="30" width="960" height="22" fill="#0078d4"/>
<text x="480" y="34" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Vertical vs horizontal scaling</text>
<text x="255" y="95" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1b2733" text-anchor="middle">Vertical — scale UP / DOWN</text><rect x="180" y="260" width="150" height="100" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="255" y="306.625" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1b2733" text-anchor="middle">VM</text><text x="255" y="323.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1b2733" text-anchor="middle">4 vCPU · 8 GB</text><path d="M255 250L255 190" stroke="#005a9e" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="155" y="115" width="200" height="130" rx="10" fill="#e6f2e6" stroke="#107c10" stroke-width="1.4"/><text x="255" y="176.375" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" fill="#1b2733" text-anchor="middle">Bigger VM</text><text x="255" y="194.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" fill="#1b2733" text-anchor="middle">16 vCPU · 64 GB</text><text x="255" y="400" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400" fill="#1b2733" text-anchor="middle">More power on ONE machine</text><text x="690" y="95" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1b2733" text-anchor="middle">Horizontal — scale OUT / IN</text><rect x="545" y="150" width="90" height="80" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="590" y="195.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1b2733" text-anchor="middle">VM</text><rect x="650" y="150" width="90" height="80" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="695" y="195.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1b2733" text-anchor="middle">VM</text><rect x="755" y="150" width="90" height="80" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="800" y="195.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1b2733" text-anchor="middle">VM</text><path d="M690 245L690 285" stroke="#005a9e" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="505" y="295" width="66" height="66" rx="10" fill="#e6f2e6" stroke="#107c10" stroke-width="1.4"/><text x="538" y="332.6875" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1b2733" text-anchor="middle">VM</text><rect x="583" y="295" width="66" height="66" rx="10" fill="#e6f2e6" stroke="#107c10" stroke-width="1.4"/><text x="616" y="332.6875" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1b2733" text-anchor="middle">VM</text><rect x="661" y="295" width="66" height="66" rx="10" fill="#e6f2e6" stroke="#107c10" stroke-width="1.4"/><text x="694" y="332.6875" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1b2733" text-anchor="middle">VM</text><rect x="739" y="295" width="66" height="66" rx="10" fill="#e6f2e6" stroke="#107c10" stroke-width="1.4"/><text x="772" y="332.6875" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1b2733" text-anchor="middle">VM</text><rect x="817" y="295" width="66" height="66" rx="10" fill="#e6f2e6" stroke="#107c10" stroke-width="1.4"/><text x="850" y="332.6875" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1b2733" text-anchor="middle">VM</text><text x="690" y="400" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400" fill="#1b2733" text-anchor="middle">More IDENTICAL machines side by side (VM scale sets do this automatically)</text><text x="480" y="440" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#005a9e" text-anchor="middle">Elasticity = automatic scaling that follows demand in both directions</text>
</svg>