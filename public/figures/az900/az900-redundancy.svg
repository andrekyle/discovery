<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Storage redundancy — how many copies, how far apart">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#005a9e"/>
  </marker>
</defs>
<rect x="0" y="0" width="960" height="470" rx="14" fill="#ffffff" stroke="#c7d5e0"/>
<rect x="0" y="0" width="960" height="52" rx="14" fill="#0078d4"/>
<rect x="0" y="30" width="960" height="22" fill="#0078d4"/>
<text x="480" y="34" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Storage redundancy — how many copies, how far apart</text>
<rect x="55" y="100" width="200" height="165" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="155" y="164.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1b2733" text-anchor="middle">LRS</text><text x="155" y="185.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">3 copies, one datacenter</text><text x="155" y="202" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="155" y="218.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">survives drive/rack failure</text><rect x="275" y="100" width="200" height="165" rx="10" fill="#e6f2e6" stroke="#107c10" stroke-width="1.4"/><text x="375" y="164.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1b2733" text-anchor="middle">ZRS</text><text x="375" y="185.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">3 copies across zones</text><text x="375" y="202" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="375" y="218.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">survives a datacenter loss</text><rect x="495" y="100" width="200" height="165" rx="10" fill="#efe9f7" stroke="#5c2d91" stroke-width="1.4"/><text x="595" y="164.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1b2733" text-anchor="middle">GRS</text><text x="595" y="185.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">LRS + 3 in paired region</text><text x="595" y="202" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="595" y="218.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">survives a regional disaster</text><rect x="715" y="100" width="200" height="165" rx="10" fill="#fdeee8" stroke="#d83b01" stroke-width="1.4"/><text x="815" y="164.5" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1b2733" text-anchor="middle">GZRS</text><text x="815" y="185.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">ZRS + 3 in paired region</text><text x="815" y="202" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle"></text><text x="815" y="218.25" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">highest durability</text><text x="480" y="310" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400" fill="#5b6770" text-anchor="middle">RA-GRS / RA-GZRS add read access to the secondary region at any time</text><text x="480" y="350" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1b2733" text-anchor="middle">More copies, further apart = more durable (and more expensive)</text><text x="480" y="395" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#5b6770" text-anchor="middle">Moving data: AzCopy (CLI) · Storage Explorer (GUI) · File Sync (cache shares on-prem) · Azure Migrate &amp; Data Box (bulk)</text>
</svg>