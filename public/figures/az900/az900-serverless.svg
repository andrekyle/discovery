<text x="480" y="34" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Serverless — code runs only when events happen</text>
<rect x="60" y="120" width="200" height="110" rx="10" fill="#e6f2fb" stroke="#0078d4" stroke-width="1.4"/><text x="160" y="164.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1b2733" text-anchor="middle">Event</text><text x="160" y="184.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">HTTP request · timer</text><text x="160" y="201" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">file upload · message</text><path d="M262 175L358 175" stroke="#005a9e" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="360" y="105" width="240" height="140" rx="10" fill="#e6f2e6" stroke="#107c10" stroke-width="1.4"/><text x="480" y="165.125" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1b2733" text-anchor="middle">Azure Functions</text><text x="480" y="186.375" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">platform provisions,</text><text x="480" y="202.625" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">runs and scales the code</text><path d="M602 175L698 175" stroke="#005a9e" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="700" y="120" width="200" height="110" rx="10" fill="#efe9f7" stroke="#5c2d91" stroke-width="1.4"/><text x="800" y="164.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1b2733" text-anchor="middle">Bill</text><text x="800" y="184.75" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">only for execution time</text><text x="800" y="201" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5b6770" text-anchor="middle">zero when idle</text><text x="480" y="305" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600" fill="#1b2733" text-anchor="middle">No servers to size, patch or manage — scaling from zero to peak is automatic</text>
